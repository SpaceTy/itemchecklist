<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/itemchecklist/">
  <title>Item Checklist</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
</head>
<body>
  <div id="app">
    <div class="row">
      <h1 style="margin:0">Checklist</h1>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div class="toggle">
          <label class="switch" for="claimToggle">
            <input id="claimToggle" type="checkbox">
            <span class="slider"></span>
          </label>
          <label id="claimLabel" for="claimToggle">Claim Mode</label>
        </div>
        <div class="toggle">
          <label class="switch" for="completionToggle">
            <input id="completionToggle" type="checkbox">
            <span class="slider"></span>
          </label>
          <label id="completionLabel" for="completionToggle">Item Based</label>
        </div>
        <div class="sort-controls">
          <select id="sortMode">
            <option value="none">No Sort</option>
            <option value="alphabetical">A-Z</option>
            <option value="progress">Progress</option>
            <option value="target">Target</option>
          </select>
          <button id="sortBtn">Sort</button>
          <select id="finishedPriority">
            <option value="neutral">Finished: Neutral</option>
            <option value="first">Finished: First</option>
            <option value="last">Finished: Last</option>
          </select>
        </div>
      </div>
      <div id="userBar" style="display:none">
        <span id="currentUser"></span>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
    <div class="search-container">
      <input id="searchInput" type="text" placeholder="Search items... (fuzzy)" autocomplete="off">
      <button id="clearSearch" style="display:none">✕</button>
    </div>
    <div id="login">
      <div id="loginPanel">
        <input id="loginUsername" type="text" placeholder="Username" autocomplete="username">
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn">Login</button>
        <span id="loginMsg"></span>
        <span class="auth-toggle">No account? <a href="#" id="showRegister">Register</a></span>
      </div>
      <div id="registerPanel" style="display:none">
        <input id="regUsername" type="text" placeholder="Username" autocomplete="username">
        <input id="regPassword" type="password" placeholder="Password" autocomplete="new-password">
        <button id="registerBtn">Register</button>
        <span id="registerMsg"></span>
        <span class="auth-toggle">Have an account? <a href="#" id="showLogin">Login</a></span>
      </div>
    </div>
    <div id="items"></div>
    <div id="adminPanel" style="display:none">
      <h2>User Management</h2>
      <div id="userList"></div>
    </div>
    <div id="completion-bar">
      <div class="bar-container">
        <div class="bar-fill"></div>
      </div>
      <div class="bar-label">0%</div>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
